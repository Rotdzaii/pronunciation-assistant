services:
  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8081:80"

  backend:
    build: .
    working_dir: /app/fastapi-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false

  ai-worker:
    build: .
    working_dir: /app/ai-worker
    command: python worker.py
    depends_on:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      NODE_WEBHOOK_URL: http://backend:8000/practice/webhook/ai-result
      SCORER_MODE: cnn_attention_context
      CNN_ATTENTION_CONTEXT_CHECKPOINT_PATH: /app/ai-worker/checkpoints/l2_arctic_cnn_attention_speaker_disjoint_context_stability_seed_42_HQTV.pt
      ALIGNMENT_MODE: fallback
